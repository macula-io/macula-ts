name: Live

# Runs the live station tests (src/*.live.test.ts) against real stations. It is
# dispatched by hand and never runs on push or PR, because a station outage or
# a network hiccup must not make ordinary CI flaky. Both stations are required
# inputs with no default, so every run names the stations it used.
#
# Every step lives in scripts/run-live-tests.sh, which is also how to run the
# live tests by hand, so a local run and this job carry out the same steps.
# The tests load the committed prebuild, the same .node file the npm package
# ships; on the same commit, ci.yml's "Confirm the committed prebuild is not
# stale" step shows that this prebuild matches the source.
#
# The public stations have IPv6 addresses only, and GitHub-hosted runners have
# no IPv6. On ubuntu-latest the script's route check therefore fails within
# seconds, naming the station and the missing route. The job needs a runner
# with IPv6; naming one here is a reviewed change to runs-on.

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Host name of the station every live test uses (MACULA_TS_LIVE_STATION)"
        required: true
        type: string
      other_station:
        description: "Host name of a second station, for the pool's multi-station test (MACULA_TS_LIVE_OTHER_STATION)"
        required: true
        type: string

permissions:
  contents: read

# Two runs at once would share the stations, so a second dispatch waits.
concurrency:
  group: live-stations
  cancel-in-progress: false

jobs:
  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Live station tests
        env:
          MACULA_TS_LIVE_STATION: ${{ inputs.station }}
          MACULA_TS_LIVE_OTHER_STATION: ${{ inputs.other_station }}
          MACULA_TS_LIVE_WAITS: ${{ runner.temp }}/live-waits.log
        run: scripts/run-live-tests.sh
