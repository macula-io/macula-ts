name: Live

# Runs the live station test (src/fleet.live.test.ts) against one real macula
# 12 station. It is dispatched by hand and never runs on push or PR, because a
# station outage or a network hiccup must not make ordinary CI flaky. The
# station is pinned by its node_id and the realm by its key, all required
# inputs with no default, so every run names what it trusted.
#
# The tests load an addon built here from this commit's source: macula-go's
# shared C ABI at native/MACULA_GO, linked by node-gyp, the same build the
# release's linux-x64 prebuild is.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "The station, host:port, [v6]:port for IPv6 (MACULA_TS_LIVE_SEED)"
        required: true
        type: string
      station_id:
        description: "The station's node_id, 64 hex (MACULA_TS_LIVE_STATION_ID)"
        required: true
        type: string
      realm:
        description: "The realm id, 64 hex, whose mcl-echo/echo the test calls (MACULA_TS_LIVE_REALM)"
        required: true
        type: string
      realm_key:
        description: "The realm's key as carried, hex (MACULA_TS_LIVE_REALM_KEY)"
        required: true
        type: string

permissions:
  contents: read

# Two runs at once would share the stations, so a second dispatch waits.
concurrency:
  group: live-stations
  cancel-in-progress: false

jobs:
  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Build macula-go's cabi, then the addon
        run: |
          npm run build:go
          npm ci

      - name: Live station test
        env:
          MACULA_TS_LIVE_SEED: ${{ inputs.seed }}
          MACULA_TS_LIVE_STATION_ID: ${{ inputs.station_id }}
          MACULA_TS_LIVE_REALM: ${{ inputs.realm }}
          MACULA_TS_LIVE_REALM_KEY: ${{ inputs.realm_key }}
        run: npm run test:live
