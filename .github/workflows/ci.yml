name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Builds and tests on linux-x64; prebuilds (below) builds every platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      # Before `npm ci`: binding.gyp's presence makes npm run `node-gyp
      # rebuild` on install, which links native/build/libmacula.a. A dev and
      # CI concern only: binding.gyp is not published.
      - name: Build macula-go's cabi at native/MACULA_GO
        run: npm run build:go

      - name: Install (builds the native addon via node-gyp)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build TypeScript output, and confirm the committed dist/ is exactly it
        run: |
          npm run build:ts
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/
            echo "::error::committed dist/ is not a fresh build of src/ (stale or extra files) -- run 'npm run build:ts' and commit the result"
            exit 1
          fi

  prebuilds:
    uses: ./.github/workflows/prebuild-matrix.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  zero-install:
    # The package as npm would carry it, with the five prebuilds just built,
    # installs and works with no compiler and no install script: on Linux, and
    # on Windows from the installed layout, where the addon needs macula.dll
    # beside it (and fails at once, naming it, without it).
    needs: prebuilds
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds-in

      - name: Assemble prebuilds/ and pack
        run: |
          set -euo pipefail
          for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mkdir -p "prebuilds/$plat"
            cp prebuilds-in/prebuild-$plat/* "prebuilds/$plat/"
          done
          rm -f binding.gyp
          mkdir -p ../pack
          npm pack --pack-destination ../pack

      - name: A consumer install needs zero compilation
        run: |
          set -euo pipefail
          TARBALL=$(ls "$PWD"/../pack/macula-io-ts-*.tgz)
          mkdir -p ../consumer && cd ../consumer
          npm init -y >/dev/null
          npm install --loglevel verbose "$TARBALL" > install.log 2>&1
          # Not a bare "node-gyp": node-gyp-build, the runtime loader, appears
          # in a verbose log as a package name. These are compile signals.
          pattern='node-gyp rebuild|node-gyp configure|node-gyp build|gyp info|gyp ERR|CXX\(target\)|CC\(target\)|SOLINK_MODULE|make: Entering directory|prebuild-install|MSBuild|> node-gyp'
          if grep -Eiq "$pattern" install.log; then
            grep -Ein "$pattern" install.log
            echo "::error::installing the package ran a build step"
            exit 1
          fi
          for p in binding.gyp addon native scripts; do
            if [ -e "node_modules/@macula-io/ts/$p" ]; then
              echo "::error::the published package carries build sources ($p)"
              exit 1
            fi
          done
          timeout 120 node --input-type=module -e "
            import { NodeKey } from '@macula-io/ts';
            const key = await NodeKey.generate('pq_pure');
            if (key.nodeId().length !== 32) throw new Error('bad nodeId length');
            key.free();
            console.log('consumer install verified end to end, zero build steps');
          "

      - name: Without macula.dll the addon fails at once, naming it (Windows)
        if: runner.os == 'Windows'
        run: |
          set -uo pipefail
          cd ../consumer
          echo "in $(pwd)"
          ls -l node_modules/@macula-io/ts/prebuilds/win32-x64/
          test -f node_modules/@macula-io/ts/prebuilds/win32-x64/macula.dll || { echo "::error::no macula.dll in the installed package"; exit 1; }
          rm node_modules/@macula-io/ts/prebuilds/win32-x64/macula.dll
          start=$(date +%s)
          # The shell runs with -e; this command is expected to fail.
          set +e
          timeout 60 node --input-type=module -e "import('@macula-io/ts')" > out.log 2>&1
          code=$?
          set -e
          took=$(( $(date +%s) - start ))
          cat out.log
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::without macula.dll the import exited $code after $took s: it must fail, not load or hang"
            exit 1
          fi
          grep -q "macula.dll" out.log || { echo "::error::the failure does not name macula.dll"; exit 1; }
          echo "failed as it must, in $took s, naming macula.dll"
