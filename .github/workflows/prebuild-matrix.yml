name: Prebuild matrix

# Builds the native addon for every supported platform, from source, on a real
# runner of that platform (cgo needs its own C toolchain; no cross-compiling):
# macula-go's shared C ABI at native/MACULA_GO as a c-archive
# (scripts/build-native.sh), linked into the addon by node-gyp, packed by
# prebuildify. Each prebuild is loaded and used once, with build/ removed, so
# what is uploaded is what a consumer's node-gyp-build will load. A release
# attests each one (build provenance); nothing is ever committed.

on:
  workflow_call:
    inputs:
      attest:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          # THE LINUX PREBUILDS ARE BUILT ON UBUNTU 22.04 (glibc 2.35, libstdc++
          # GLIBCXX_3.4.30), the oldest baseline in wide use, so they load on
          # Debian 12 and Ubuntu 22.04 too. Built on 24.04 the addon needed
          # GLIBCXX_3.4.31 and failed to load on bookworm (macula-ts#12). The
          # bookworm step below holds that.
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
    name: prebuild (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      # cgo needs a gcc-compatible compiler for the c-archive; windows-latest
      # has MSVC (which node-gyp uses for the addon) but no gcc.
      - name: Install MinGW gcc for cgo (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build macula-go's cabi (Windows, MinGW gcc)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: CC=gcc npm run build:go

      - name: Build macula-go's cabi
        if: runner.os != 'Windows'
        run: npm run build:go

      # binding.gyp makes npm install run node-gyp, which links the archive.
      - run: npm ci

      - name: Produce this platform's prebuild
        run: npx prebuildify --napi --strip

      # On Windows the addon links macula-go's DLL (scripts/build-native.sh
      # says why), which Node's loader finds beside the .node. It must need
      # nothing but Windows itself: a MinGW runtime DLL would load on this
      # runner and be missing on a user's machine.
      - name: The DLL imports only system DLLs (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          imports=$(objdump -p native/build/macula-*.dll | sed -n 's/^.*DLL Name: //p')
          echo "$imports"
          if echo "$imports" | grep -Eiv '^(kernel32|msvcrt|advapi32|ws2_32|winmm|ntdll|user32|bcrypt|crypt32|iphlpapi|dnsapi|secur32|userenv|powrprof|api-ms-win-[a-z0-9-]+)\.dll$' | grep -q .; then
            echo "::error::macula's DLL imports a DLL Windows does not carry"
            exit 1
          fi

      - name: Put macula's DLL beside the prebuild (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp native/build/macula-*.dll prebuilds/${{ matrix.platform }}/

      # Two stages, each bounded, so a hang says where: loading the addon runs
      # the ABI version check, the first call into Go; generating a key is the
      # first real work.
      - name: The prebuild loads and works without build/
        shell: bash
        env:
          PREBUILDS_ONLY: "1"
        run: |
          set -euo pipefail
          # A bound from outside the process: a hang inside a native call
          # blocks Node's own timers. macOS has no GNU timeout; perl's alarm
          # kills the process the same way.
          bound() {
            if command -v timeout > /dev/null; then timeout "$@"; else perl -e 'alarm shift @ARGV; exec @ARGV' "$@"; fi
          }
          test -f prebuilds/${{ matrix.platform }}/*.node
          rm -rf build
          echo "stage 1: load the addon"
          bound 120 node -e '
            const native = require("node-gyp-build")(process.cwd());
            console.log("loaded, C ABI " + native.abiVersion);
          '
          echo "stage 2: generate a key"
          bound 120 node --input-type=module -e "
            import { NodeKey } from './dist/index.js';
            const key = await NodeKey.generate('pq_pure');
            if (key.nodeId().length !== 32) throw new Error('bad nodeId length');
            key.free();
            console.log('${{ matrix.platform }}: the prebuild loads and generates a key');
          "

      # The prebuild on the oldest host it promises: Debian 12 (bookworm), whose
      # libstdc++ stops at GLIBCXX_3.4.30. Loaded and used there with build/
      # removed, as a consumer's install would. macula-ts#12.
      - name: The prebuild loads on Debian 12 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rm -rf build
          docker run --rm -v "$PWD:/w" -w /w -e PREBUILDS_ONLY=1 node:24-bookworm \
            timeout 120 node --input-type=module -e "
              const { createRequire } = await import('node:module');
              const native = createRequire(import.meta.url)('node-gyp-build')(process.cwd());
              const { NodeKey } = await import('./dist/index.js');
              const key = await NodeKey.generate('pq_pure');
              if (key.nodeId().length !== 32) throw new Error('bad nodeId length');
              key.free();
              console.log('${{ matrix.platform }} on bookworm: C ABI ' + native.abiVersion + ', a key generated');
            "

      - name: Attest the prebuild
        if: inputs.attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: prebuilds/${{ matrix.platform }}/*

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/${{ matrix.platform }}/*
          if-no-files-found: error
