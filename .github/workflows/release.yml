name: Release to npm

# A v* tag publishes that version to npm through Trusted Publishing (OIDC; no
# token is stored). Nothing publishes unless the tag names package.json's
# version, the suite is green, and all five platform prebuilds built from
# source here, each loaded and attested (build provenance), before they are
# packed. Prebuilds are never committed (macula-ts#2).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names package.json's version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name package.json's version $PKG_VERSION"
            exit 1
          fi

  test:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm run build:go
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  prebuilds:
    needs: guard
    uses: ./.github/workflows/prebuild-matrix.yml
    with:
      attest: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: publish to npm
    needs: [test, prebuilds]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      # --ignore-scripts: binding.gyp would otherwise make npm build the addon
      # here, and nothing past this point compiles anything.
      - run: npm ci --ignore-scripts

      - name: Build TypeScript output, and confirm the committed dist/ is exactly it
        run: |
          npm run build:ts
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::committed dist/ is not a fresh build of src/"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds-in

      - name: Assemble all five prebuilds, refusing an incomplete set
        run: |
          set -euo pipefail
          for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            ls prebuilds-in/prebuild-$plat/*.node > /dev/null || { echo "::error::no $plat prebuild"; exit 1; }
            mkdir -p "prebuilds/$plat"
            cp prebuilds-in/prebuild-$plat/* "prebuilds/$plat/"
          done
          test -f prebuilds/win32-x64/macula.dll || { echo "::error::no macula.dll beside the win32 prebuild"; exit 1; }
          ls -l prebuilds/*/

      # Trusted Publishing (OIDC) needs npm CLI >= 11.5.0: an older bundled npm
      # falls through to an unauthenticated publish that comes back 404
      # (macula-mcp hit this first).
      - run: npm install -g npm@11
      - run: npm --version

      # 0.13.0 to 0.13.4 published with a stray "install": "node-gyp rebuild"
      # in the published package.json. Two things were needed, and both stay:
      # no lifecycle script may rebuild at publish (package.json has no
      # prepublishOnly, and none is added here), and binding.gyp must not be
      # in the directory npm publish runs from, since its presence alone is
      # what made npm add the key. Proved here, then published as checked.
      - name: Prove the package carries no install script
        run: |
          set -euo pipefail
          rm -f binding.gyp
          if node -p "const s = require('./package.json').scripts || {}; s.install !== undefined || s.prepublishOnly !== undefined || s.preinstall !== undefined || s.postinstall !== undefined" | grep -q true; then
            echo "::error::package.json has an install or prepublish lifecycle script -- refusing to publish"
            exit 1
          fi
          npm pack --dry-run --json > pack.json
          node -e '
            const [pack] = require("./pack.json");
            const files = pack.files.map((f) => f.path);
            for (const p of ["binding.gyp", "addon/", "native/", "scripts/"]) {
              if (files.some((f) => f === p || f.startsWith(p))) throw new Error("the package would carry " + p);
            }
            for (const plat of ["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64", "win32-x64"]) {
              if (!files.some((f) => f.startsWith("prebuilds/" + plat + "/") && f.endsWith(".node"))) throw new Error("no " + plat + " prebuild in the package");
            }
            if (!files.includes("prebuilds/win32-x64/macula.dll")) throw new Error("no macula.dll beside the win32 prebuild");
            console.log(files.length + " files, five prebuilds, no build sources");
          '
          rm pack.json

      - run: npm publish --access public --provenance
